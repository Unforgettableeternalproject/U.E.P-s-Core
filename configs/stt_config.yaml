# TestSeparateSTTSystem Configuration
# 從 U.E.P Core stt_module/config.yaml 遷出並清理

# ─── Whisper 模型 ──────────────────────────────────────────
whisper:
  model_id: "openai/whisper-base"       # Hugging Face 模型 ID
  local_path: "models/stt/whisper/whisper-base"  # 本地模型目錄
  use_local_model: true                  # 優先使用本地模型
  device: "auto"                         # auto / cuda / cpu
  torch_dtype: "auto"                    # auto / float16 / float32

# ─── 音訊輸入 ──────────────────────────────────────────────
audio:
  sample_rate: 16000                     # Whisper 標準採樣率
  device_index: null                     # 麥克風裝置索引 (null = 系統預設)
  phrase_time_limit: 5                   # 單句錄音最大長度 (秒)
  format: "int16"                        # 音訊格式
  channels: 1                            # 通道數
  frames_per_buffer: 1024                # 緩衝區大小

# ─── 辨識模式 ──────────────────────────────────────────────
recognition:
  default_mode: "manual"                 # manual / continuous
  max_new_tokens: 128                    # 生成最大 token 數
  task: "transcribe"                     # transcribe / translate
  language: null                         # null = 自動偵測, "zh" / "en" 等
  no_speech_threshold: 0.4              # 無語音判定閾值
  compression_ratio_threshold: 1.35     # 壓縮比閾值

# ─── 持續監聽 ──────────────────────────────────────────────
continuous:
  chunk_duration: 2.0                    # 每次錄音片段長度 (秒)
  silence_threshold: 1.5                 # 靜音持續時間閾值 (秒)
  max_speech_duration: 30.0              # 單次語音最大長度 (秒)
  total_duration: 30.0                   # 總監聽時長 (秒)

# ─── VAD (語音活動偵測) ────────────────────────────────────
vad:
  sensitivity: 0.7                       # 靈敏度 (0.0-1.0)
  min_speech_duration: 0.3               # 最小語音持續時間 (秒)
  energy_threshold_base: 0.0005          # 基礎能量閾值
  silence_duration_threshold: 0.8        # 靜音判定閾值 (秒)
  window_size: 0.025                     # 分析窗口大小 (秒)

# ─── 語者識別 ──────────────────────────────────────────────
speaker:
  enabled: false                         # 是否啟用語者識別
  model: "pyannote/speaker-diarization-3.1"
  embedding_model: "pyannote/embedding"
  database_path: "memory/speaker_models.pkl"
  similarity_threshold: 0.999995
  min_samples_for_recognition: 15
  use_multi_distance: true
  distance_weights:
    cosine: 0.3
    euclidean: 0.3
    magnitude: 0.2
    correlation: 0.2
  confidence_max_cap: 0.98

# ─── 智能喚醒 ──────────────────────────────────────────────
keyword:
  enabled: true
  activation_threshold: 0.6
  wake_confidence_threshold: 0.8

# ─── 後處理 ────────────────────────────────────────────────
post_processing:
  text_correction: true
  remove_filler_words: true
  normalize_punctuation: true

# ─── 效能 ──────────────────────────────────────────────────
performance:
  use_fp16: true
  batch_size: 1
  chunk_length: 30
