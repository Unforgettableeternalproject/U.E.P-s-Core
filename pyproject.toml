[project]
name = "test-separate-tts-system"
version = "0.1.0"
description = "Standalone U.E.P TTS latency and IndexTTS2 optimization experiment project"
authors = [{name = "U.E.P Team"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.9", "black>=23.12.0"]
tts = [
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "omegaconf>=2.3.0",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
