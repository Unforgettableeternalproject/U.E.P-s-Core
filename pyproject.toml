[project]
name = "test-separate-tts-system"
version = "0.1.0"
description = "Standalone U.E.P TTS latency and IndexTTS2 optimization experiment project"
authors = [{name = "U.E.P Team"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.9", "black>=23.12.0"]
tts = [
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "omegaconf>=2.0.6",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.0",
    "transformers>=4.48.0",
    "accelerate>=1.1.0",
    "peft>=0.10.0",
    "einops>=0.8.0",
    "librosa>=0.10.0",
    "scipy>=1.11.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.9.0",
    "jieba>=0.42.1",
    "pysbd>=0.3.4",
    "opencc-python-reimplemented>=0.1.7",
    "wetext>=0.0.9",
    "munch>=4.0.0",
    "modelscope>=1.27.0",
    "descript-audiotools>=0.7.2",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "packaging>=23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
