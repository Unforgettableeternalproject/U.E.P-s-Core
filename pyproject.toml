[project]
name = "session-control"
version = "0.1.0"
description = "LLM 會話控制子系統 — Prompt/Token/Context 三大指標優化引擎"
authors = [
    {name = "U.E.P Team", email = "ptyc4076@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.12.0"]
gemini = ["google-genai>=1.0.0"]
local = ["transformers>=4.38.0"]
llmlingua = ["llmlingua>=0.2.0"]
full = [
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "google-genai>=1.0.0",
    "llmlingua>=0.2.0",
]

[project.scripts]
session-cli = "Entry:main"
session-demo = "examples.minimal_session:main"

[tool.setuptools.packages.find]
include = ["session_control*"]
exclude = ["tests*", "examples*", "docs*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=session_control --cov-report=html --cov-report=term"
