# VoxCPM2 台灣華語口音 LoRA（Common Voice zh-TW 清洗版，多語者）；官方 voxcpm_finetune_lora 邏輯：r=32、LM+DiT、lr 1e-4
# 執行：.venv-voxcpm/Scripts/python.exe experiments/voxcpm2_lora_train.py --config_path experiments/voxcpm2_lora_tw.yaml
pretrained_path: models_cache/VoxCPM2
train_manifest: outputs/tw_lora_data/train.jsonl
val_manifest: outputs/tw_lora_data/val.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 16      # 有效 batch 16 句 ≈ 170 step / epoch
num_workers: 0
preprocessing_num_workers: 1
num_iters: 600
log_interval: 5
valid_interval: 10000
save_interval: 50
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 30
max_steps: 600
max_batch_tokens: 2048
max_grad_norm: 1.0
save_path: models_cache/vox_lora_tw/checkpoints
tensorboard: models_cache/vox_lora_tw/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
