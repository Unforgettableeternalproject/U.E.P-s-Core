<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>U.E.P 語音盲測</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* U.E.P Imaginary Space 設計系統：核心主題（gold）。深色為預設，跟隨系統亮度，可手動切換。 */
  :root{
    --uep-gold:#d5b618; --uep-gold-soft:#e9cd3f; --accent-ink:#6e5c0f;
    --bg:#14151a; --bg-soft:#1b1d24; --bg-card:#20232c; --bg-sunken:#0e0f13;
    --ink-title:#ffffff; --ink:#ece9df; --ink-soft:#b3ae9f; --ink-mute:#7a7669;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.18);
    --hairline:rgba(255,255,255,.1); --hairline-strong:rgba(255,255,255,.22);
    --core-main:var(--uep-gold); --core-soft:var(--uep-gold-soft);
    --core-tint:rgba(213,182,24,.2); --core-stroke:rgba(213,182,24,.65);
    --status-error:#f87171; --status-error-text:#f87171;
    --on-gold:#1f1b14;
    --font-display:"Cormorant Garamond","Source Han Serif TC","Noto Serif TC",Georgia,"Songti TC",serif;
    --font-serif-tc:"Noto Serif TC","Source Han Serif TC",Georgia,"Songti TC",serif;
    --font-sans:Inter,"Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
    --radius-panel:4px; --radius-input:8px; --radius-pill:999px;
    --ease:cubic-bezier(.2,.7,.3,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --shadow-toast:0 0 0 1px rgba(213,182,24,.08),0 8px 24px rgba(0,0,0,.35);
    --gutter:20px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#fafaf7; --bg-soft:#f4f2eb; --bg-card:#ffffff; --bg-sunken:#eceae0;
      --ink-title:#1f1b14; --ink:#2a2620; --ink-soft:#5c5749; --ink-mute:#8a8474;
      --line:rgba(59,65,80,.1); --line-strong:rgba(59,65,80,.2);
      --hairline:rgba(31,27,20,.14); --hairline-strong:rgba(31,27,20,.28);
      --core-main:var(--accent-ink); --core-soft:var(--uep-gold);
      --core-tint:rgba(213,182,24,.12); --core-stroke:rgba(110,92,15,.7);
      --status-error-text:#b86060; --on-gold:#1f1b14;
      --shadow-toast:0 0 0 1px rgba(213,182,24,.08),0 8px 24px rgba(0,0,0,.12);
    }
  }
  :root[data-theme="light"]{
    --bg:#fafaf7; --bg-soft:#f4f2eb; --bg-card:#ffffff; --bg-sunken:#eceae0;
    --ink-title:#1f1b14; --ink:#2a2620; --ink-soft:#5c5749; --ink-mute:#8a8474;
    --line:rgba(59,65,80,.1); --line-strong:rgba(59,65,80,.2);
    --hairline:rgba(31,27,20,.14); --hairline-strong:rgba(31,27,20,.28);
    --core-main:var(--accent-ink); --core-soft:var(--uep-gold);
    --core-tint:rgba(213,182,24,.12); --core-stroke:rgba(110,92,15,.7);
    --status-error-text:#b86060; --on-gold:#1f1b14;
    --shadow-toast:0 0 0 1px rgba(213,182,24,.08),0 8px 24px rgba(0,0,0,.12);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh; min-height:100dvh;
    font-family:var(--font-serif-tc); font-size:15px; line-height:1.9;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 var(--gutter) 64px}
  [hidden]{display:none!important}

  /* 頂欄：品牌標記 + 主題切換，底部細線 */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0;border-bottom:1px solid var(--hairline)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .mark{flex:none;width:34px;height:34px;border:1px solid var(--uep-gold);border-radius:50%;
    display:grid;place-items:center;font-family:var(--font-display);font-weight:600;
    font-size:18px;color:var(--uep-gold);line-height:1}
  .brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-title);
    line-height:1.2;white-space:nowrap}
  .brand-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;color:var(--ink-mute);
    text-transform:uppercase}
  .theme-btn{flex:none;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;
    background:transparent;color:var(--ink-soft);border:1px solid var(--line-strong);
    border-radius:var(--radius-pill);min-height:36px;padding:0 14px;cursor:pointer;
    transition:color .2s var(--ease),border-color .2s var(--ease)}
  .theme-btn:hover{color:var(--core-main);border-color:var(--core-stroke)}

  /* 等寬標籤 */
  .mono{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-mute)}
  .kicker{display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:10px;
    letter-spacing:.34em;text-transform:uppercase;color:var(--core-main)}
  .kicker::before{content:"";width:28px;height:1px;background:var(--uep-gold)}

  h1{font-family:var(--font-display);font-weight:600;color:var(--ink-title);
    font-size:42px;line-height:1.15;margin:18px 0 12px;letter-spacing:.01em}
  .lede{font-style:italic;font-size:16px;line-height:1.9;color:var(--ink-soft);margin:0 0 8px}

  .rule{height:1px;background:var(--hairline);border:0;margin:24px 0}
  .field-label{display:block;margin:0 0 8px}
  input[type=text]{
    width:100%;min-height:52px;padding:0 14px;font:16px var(--font-serif-tc); /* 16px 避免 iOS 聚焦放大 */
    color:var(--ink);background:var(--bg-sunken);border:1px solid var(--line-strong);
    border-radius:var(--radius-input);outline:none;
    transition:border-color .2s var(--ease)}
  input[type=text]:focus{border-color:var(--core-stroke)}
  .hint{font-size:13px;line-height:1.8;color:var(--ink-mute);margin:8px 0 0}

  /* 按鈕：細線膠囊，hover/按下轉色，不改高度 */
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    min-height:60px;padding:0 24px;cursor:pointer;
    font-family:var(--font-mono);font-size:13px;letter-spacing:.16em;text-transform:none;
    color:var(--core-main);background:transparent;border:1px solid var(--core-stroke);
    border-radius:var(--radius-pill);-webkit-tap-highlight-color:transparent;
    transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
  .btn:active{background:var(--uep-gold);color:var(--on-gold);border-color:var(--uep-gold)}
  @media (hover:hover){ .btn:hover:not([disabled]){background:var(--uep-gold);color:var(--on-gold);border-color:var(--uep-gold)} }
  .btn:focus-visible,.theme-btn:focus-visible{outline:2px solid var(--uep-gold);outline-offset:2px}
  .btn[disabled]{opacity:.38;cursor:not-allowed;background:transparent;color:var(--core-main);
    border-color:var(--core-stroke)}
  .btn.chosen[disabled]{opacity:1;background:var(--uep-gold);color:var(--on-gold);border-color:var(--uep-gold)}
  .btn.plain{min-height:52px;color:var(--ink-soft);border-color:var(--line-strong)}
  .set-list{display:grid;gap:12px}

  /* 進度 */
  .progress{padding:20px 0 4px}
  .progress-row{display:flex;justify-content:space-between;align-items:baseline}
  .progress-num{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink-title)}
  .bar{height:2px;margin-top:10px;background:var(--hairline);border-radius:1px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--uep-gold);transition:width .3s var(--ease)}

  /* 題目與 A/B 卡片 */
  .prompt{font-size:15px;line-height:2;color:var(--ink-soft);margin:16px 0 20px;
    padding-left:14px;border-left:1px solid var(--uep-gold)}
  .opt{background:var(--bg-card);border:1px solid var(--line-strong);border-radius:var(--radius-panel);
    padding:16px 16px 18px;margin-bottom:16px;transition:border-color .2s var(--ease)}
  .opt.playing{border-color:var(--core-stroke)}
  .opt-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .opt-letter{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1;
    color:var(--core-main)}
  audio{display:block;width:100%;height:48px;margin:0 0 14px}
  .fade-in{animation:reveal .45s var(--ease-out)}
  @keyframes reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .err{margin:12px 0 0;padding:12px 14px;font-size:13px;line-height:1.8;color:var(--status-error-text);
    background:var(--bg-sunken);border-left:3px solid var(--status-error);border-radius:var(--radius-input)}

  /* 結束頁 */
  .end{text-align:left;padding-top:28px}
  .end-art{display:block;width:180px;max-width:55%;height:auto;margin:20px 0 4px}
  .ritual{font-style:italic;color:var(--core-main)}

  @media (min-width:600px){ h1{font-size:56px} .wrap{padding-bottom:96px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">U</div>
      <div>
        <div class="brand-name">Imaginary Space</div>
        <div class="brand-sub">語音盲測</div>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="切換深淺色">☾ 夜間</button>
  </header>

  <!-- 開始頁 -->
  <section id="intro" hidden>
    <div class="kicker" style="margin-top:28px">Blind A/B</div>
    <h1>聽兩段，選一個。</h1>
    <p class="lede">憑第一印象就好，沒有標準答案。</p>
    <hr class="rule">
    <div id="setPicker" hidden>
      <span class="mono field-label">選擇題組</span>
      <div class="set-list" id="setList"></div>
      <hr class="rule">
    </div>
    <label class="mono field-label" for="nick">暱稱</label>
    <input type="text" id="nick" maxlength="32" autocomplete="nickname" autocapitalize="off" spellcheck="false">
    <p class="hint">只用來歸檔你的作答，可以不改。</p>
    <div style="margin-top:24px"><button class="btn" id="startBtn" type="button" disabled>開始</button></div>
    <p class="err" id="introErr" hidden></p>
  </section>

  <!-- 作答頁 -->
  <section id="quiz" hidden>
    <div class="progress">
      <div class="progress-row">
        <span class="progress-num" id="progNum">第 1 / 1 題</span>
        <span class="mono" id="progPct">0%</span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barFill"></i></div>
    </div>
    <div id="qBody"></div>
    <p class="err" id="qErr" hidden></p>
  </section>

  <!-- 結束頁 -->
  <section id="end" class="end" hidden>
    <div class="kicker">Thank you</div>
    <h1>謝謝你。</h1>
    <p class="lede">全部作答已存下。</p>
    <p class="lede ritual">現在可以關掉這一頁了。</p>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var state = { set: null, sid: null, nick: '', questions: [], done: {}, idx: 0, t0: 0, busy: false };

  // ---- 儲存（瀏覽器儲存可能被擋，全部包 try/catch）----
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } }

  // ---- 主題 ----
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function paintThemeBtn() { $('themeBtn').textContent = currentTheme() === 'dark' ? '✺ 日間' : '☾ 夜間'; }
  var saved = lsGet('uep_theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  paintThemeBtn();
  $('themeBtn').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    lsSet('uep_theme', next);
    paintThemeBtn();
  });

  // ---- 工具 ----
  function randHex(n) {
    var a = new Uint8Array(n / 2), s = '';
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2);
    return s;
  }
  function randCode() {
    var chars = 'abcdefghjkmnpqrstuvwxyz23456789', s = '', a = new Uint8Array(4);
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (var i = 0; i < 4; i++) s += chars[a[i] % chars.length];
    return s;
  }
  function show(id) {
    ['intro', 'quiz', 'end'].forEach(function (s) { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }
  function showErr(el, msg) { el.textContent = msg; el.hidden = !msg; }
  function api(path, opt) {
    return fetch(path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
  }

  // ---- 開始頁 ----
  var params = new URLSearchParams(location.search);

  function chooseSet(name) {
    state.set = name;
    var sid = lsGet('uep_sid_' + name);
    if (!sid || !/^[a-f0-9]{16,32}$/.test(sid)) { sid = randHex(32); lsSet('uep_sid_' + name, sid); }
    state.sid = sid;
    $('startBtn').disabled = false;
    Array.prototype.forEach.call($('setList').children, function (b) {
      b.classList.toggle('chosen', b.dataset.set === name);
    });
  }

  function initIntro() {
    var nick = lsGet('uep_nick');
    $('nick').value = nick || ('匿名' + randCode());
    show('intro');
    var wanted = params.get('set');
    if (wanted) { chooseSet(wanted); return; }
    api('/api/sets').then(function (res) {
      var sets = res.sets || [];
      if (!sets.length) { showErr($('introErr'), '目前沒有可作答的題組。'); return; }
      if (sets.length === 1) { chooseSet(sets[0].set); return; }
      $('setPicker').hidden = false;
      sets.forEach(function (s) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'btn plain'; b.dataset.set = s.set;
        b.textContent = s.set + ' · ' + s.pairs + ' 題';
        b.addEventListener('click', function () { chooseSet(s.set); });
        $('setList').appendChild(b);
      });
    }).catch(function () { showErr($('introErr'), '連不上伺服器，請稍後重新整理。'); });
  }

  $('startBtn').addEventListener('click', function () {
    var nick = $('nick').value.trim().slice(0, 32) || ('匿名' + randCode());
    state.nick = nick; lsSet('uep_nick', nick);
    $('startBtn').disabled = true;
    api('/api/quiz?set=' + encodeURIComponent(state.set) + '&sid=' + state.sid).then(function (q) {
      state.questions = q.questions || [];
      state.done = {};
      (q.done || []).forEach(function (p) { state.done[p] = true; });
      if (!state.questions.length) throw new Error('empty');
      var first = 0;
      while (first < state.questions.length && state.done[state.questions[first].pair]) first++;
      state.idx = first;
      if (first >= state.questions.length) { finish(); return; }
      show('quiz');
      render();
    }).catch(function () {
      $('startBtn').disabled = false;
      showErr($('introErr'), '載入題目失敗，請確認網址後再試一次。');
    });
  });

  // ---- 作答頁 ----
  function renderProgress() {
    var n = state.questions.length, answered = Object.keys(state.done).length;
    $('progNum').textContent = '第 ' + Math.min(state.idx + 1, n) + ' / ' + n + ' 題';
    var pct = Math.round(answered / n * 100);
    $('progPct').textContent = pct + '%';
    $('barFill').style.width = pct + '%';
    $('bar').setAttribute('aria-valuenow', String(pct));
  }

  function makeOption(letter, cand, q) {
    var box = document.createElement('div'); box.className = 'opt';
    var head = document.createElement('div'); head.className = 'opt-head';
    var l = document.createElement('span'); l.className = 'opt-letter'; l.textContent = letter;
    var m = document.createElement('span'); m.className = 'mono'; m.textContent = 'Audio ' + letter;
    head.appendChild(l); head.appendChild(m);
    var au = document.createElement('audio');
    au.controls = true; au.preload = 'metadata'; au.setAttribute('playsinline', '');
    au.src = cand.url;
    au.addEventListener('play', function () {
      Array.prototype.forEach.call(document.querySelectorAll('#qBody audio'), function (o) { if (o !== au) o.pause(); });
      box.classList.add('playing');
    });
    au.addEventListener('pause', function () { box.classList.remove('playing'); });
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'btn'; btn.dataset.cand = cand.cand_id;
    btn.textContent = '選這個';
    btn.addEventListener('click', function () { choose(q, cand.cand_id, btn); });
    box.appendChild(head); box.appendChild(au); box.appendChild(btn);
    return box;
  }

  function render() {
    var q = state.questions[state.idx];
    showErr($('qErr'), '');
    renderProgress();
    var body = $('qBody');
    body.textContent = '';
    var wrap = document.createElement('div'); wrap.className = 'fade-in';
    if (q.text) {
      var p = document.createElement('p'); p.className = 'prompt'; p.textContent = q.text;
      wrap.appendChild(p);
    }
    wrap.appendChild(makeOption('A', q.a, q));
    wrap.appendChild(makeOption('B', q.b, q));
    body.appendChild(wrap);
    state.busy = false;
    state.t0 = Date.now();
  }

  function setButtons(disabled, chosenBtn) {
    Array.prototype.forEach.call(document.querySelectorAll('#qBody .btn'), function (b) {
      b.disabled = disabled;
      b.classList.toggle('chosen', disabled && b === chosenBtn);
    });
  }

  function choose(q, candId, btn) {
    if (state.busy) return;
    state.busy = true;
    var elapsed = Date.now() - state.t0;
    setButtons(true, btn);
    Array.prototype.forEach.call(document.querySelectorAll('#qBody audio'), function (a) { a.pause(); });
    api('/api/review', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ set: state.set, sid: state.sid, nickname: state.nick, pair: q.pair,
        chosen: candId, shown_order: [q.a.cand_id, q.b.cand_id], elapsed_ms: elapsed })
    }).then(function () {
      state.done[q.pair] = true;
      state.idx++;
      if (state.idx >= state.questions.length) { renderProgress(); finish(); } else { render(); window.scrollTo(0, 0); }
    }).catch(function () {
      showErr($('qErr'), '這一題沒有存到。確認網路後再按一次。');
      setButtons(false);
      state.busy = false;
    });
  }

  function finish() { show('end'); }

  initIntro();
})();
</script>
</body>
</html>
