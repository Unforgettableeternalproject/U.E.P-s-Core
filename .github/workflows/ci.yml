name: CI

on:
  push:
    branches: ["master", "develop", "fix/**", "feat/**", "feature/**"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 ruff
        run: pip install "ruff>=0.1.9"

      - name: 執行 ruff lint
        # pyproject.toml 定義完整規則供本地開發，CI 先只攔截嚴重錯誤（E=errors, F=pyflakes）
        run: ruff check . --select E,F --ignore E501,E402

  test:
    name: 測試 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # lint 失敗不阻塞測試（現有程式碼有 lint 違規，逐步修復中）

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 快取 pip 依賴
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: 安裝專案（含開發依賴）
        run: pip install -e ".[dev]"

      - name: 執行測試
        env:
          # 避免 sentence-transformers 在 CI 嘗試連線 Hugging Face Hub
          # conftest.py 的 autouse fixture 會 mock SentenceTransformer
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          # 防止 google-generativeai 意外呼叫
          GOOGLE_API_KEY: "ci-placeholder-not-real"
        run: |
          pytest \
            --ignore=tests/test_hybrid_retrieval.py \
            --cov=echo_memory \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: 上傳覆蓋率報告
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

  packaging-smoke:
    name: Packaging Smoke Test
    runs-on: ubuntu-latest
    # lint 失敗不阻塞 packaging 測試

    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip install . smoke test
        run: pip install .

      - name: 驗證 echo-chat entry point 可執行
        # 只驗證 entry point 存在且可被 Python 解析，不實際執行（需要 embedding model）
        run: python -c "from examples.minimal_chat import main; print('entry point OK')"

      - name: 驗證核心模組可匯入
        run: |
          python -c "
          from echo_memory import MemoryEngine
          from echo_memory.config import get_config
          from echo_memory.schemas.episode import Episode
          from echo_memory.schemas.memory_context import MemoryContext
          from echo_memory.storage.episodic import EpisodicMemory
          from echo_memory.storage.working import WorkingMemory
          from echo_memory.retrieval.ecphory import EcphoryRetrieval
          print('所有核心模組匯入成功')
          "

      - name: 驗證不存在的 console script 已移除
        run: |
          python -c "
          import importlib.metadata
          eps = importlib.metadata.entry_points(group='console_scripts')
          names = [ep.name for ep in eps if ep.value.startswith('examples.')]
          assert 'echo-dream' not in names, f'echo-dream 不應存在，實際: {names}'
          assert 'echo-chat' in names, f'echo-chat 應存在，實際: {names}'
          print(f'entry points 驗證通過: {names}')
          "
